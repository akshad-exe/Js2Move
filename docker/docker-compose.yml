version: "3.8"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: template_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  dev-node:
    image: node:18
    working_dir: /workspace
    command: sh -c "yarn && yarn hardhat node"
    volumes:
      - ../packages/contracts:/workspace
    ports:
      - "8545:8545"
    depends_on:
      - postgres

  backend:
    build:
      context: ../packages/backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/template_db
      REDIS_URL: redis://redis:6379
      RPC_ENDPOINT: http://dev-node:8545
    volumes:
      - ../packages/backend:/app
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
      - dev-node

  indexer:
    build:
      context: ../packages/backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/template_db
      RPC_ENDPOINT: http://dev-node:8545
    command: sh -c "node dist/indexer.js"
    depends_on:
      - postgres
      - dev-node

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://backend:3001
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
